name: Attest
on: [push, pull_request]
permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/attest@v4.1.0
        with:
          subject-path: '${{ github.workspace }}/main.js'
